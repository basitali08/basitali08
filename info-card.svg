<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .line {
      opacity: 0;
      animation: fadeInSlide 0.3s ease forwards;
      animation-delay: var(--delay);
    }
    .line.revealed {
      opacity: 1;
    }
    .header {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #58a6ff;
    }
    .key {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #7ee787;
      font-weight: bold;
    }
    .value {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #c9d1d9;
    }
    .separator {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #58a6ff;
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  <rect x="1" y="1" width="478" height="318" fill="none" stroke="#30363d" stroke-width="1" rx="7"/>
  <rect x="0" y="0" width="480" height="36" fill="#161b22" rx="8"/>
  <rect x="0" y="28" width="480" height="8" fill="#161b22"/>
  <text class="header" x="24" y="24">╭─ basitali08@github ─╮</text>
  <g class="line" style="--delay: 0.50s">
    <text class="key" x="24" y="60">Name:</text>
    <text class="value" x="104" y="60">Basit Ali</text>
  </g>
  <g class="line" style="--delay: 0.65s">
    <text class="key" x="24" y="88">Role:</text>
    <text class="value" x="104" y="88">Full Stack Developer</text>
  </g>
  <g class="line" style="--delay: 0.80s">
    <text class="key" x="24" y="116">Location:</text>
    <text class="value" x="104" y="116">Pakistan</text>
  </g>
  <g class="line" style="--delay: 0.95s">
    <text class="key" x="24" y="144">Stack:</text>
    <text class="value" x="104" y="144">Python, JavaScript, React, Node.js</text>
  </g>
  <g class="line" style="--delay: 1.10s">
    <text class="key" x="24" y="172">Focus:</text>
    <text class="value" x="104" y="172">AI/ML & Web Dev</text>
  </g>
  <g class="line" style="--delay: 1.25s">
    <text class="key" x="24" y="200">Learning:</text>
    <text class="value" x="104" y="200">LangChain, FastAPI</text>
  </g>
  <g class="line" style="--delay: 1.40s">
    <text class="key" x="24" y="228">✓</text>
    <text class="value" x="104" y="228">Open Source Contributor</text>
  </g>
  <g class="line" style="--delay: 1.55s">
    <text class="key" x="24" y="256">✓</text>
    <text class="value" x="104" y="256">Building cool stuff</text>
  </g>
  <line x1="24" y1="296" x2="456" y2="296" stroke="#30363d" stroke-width="1"/>
</svg>